# Paramètres des routines de session (skill session-routines).
# Les chemins sont RELATIFS à la racine du dépôt : les scripts font "$REPO/$…".

# Dépôt d'ARCHIVES partagé — l'origine. Le répertoire parent fait l'aiguillage tout seul
# (~/Github/Archives = GitHub privé ; ~/Non-Github/Archives = local, sans remote, jamais) et
# les scripts ajoutent le niveau <projet>. Même valeur dans tous les projets : rien à saisir,
# donc rien à mal écrire. Doctrine : Archives/CLAUDE.md.
#
# 🔴 IMPÉRATIF ICI : holmesMcp est un dépôt PUBLIC. Sans ce fichier, `mem-snapshot` retombe sur
# son défaut `pilotage/archives/claude-memory` — DANS le dépôt — et publierait des fiches qui
# décrivent la doctrine sudo de la flotte et les chemins de la box. Constaté le 2026-09-08.
ARCHIVES="../Archives"
